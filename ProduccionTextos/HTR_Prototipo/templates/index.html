<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Prototipo HTR</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .contenedor {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        .descripcion {
            text-align: center;
            color: #555;
        }

        input {
            margin-top: 20px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        .resultado {
            margin-top: 30px;
            padding: 20px;
            background: #eee;
            border-radius: 8px;
        }

        .error {
            color: red;
        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1>Reconocimiento de Escritura Manuscrita</h1>

    <p class="descripcion">
        Prototipo experimental de HTR mediante inteligencia artificial.
    </p>

    <form method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="imagen"
            accept="image/*"
            required
        >

        <br>

        <button type="submit">
            Reconocer texto
        </button>

    </form>


    {% if error %}

        <p class="error">
            {{ error }}
        </p>

    {% endif %}


    {% if texto %}

        <div class="resultado">

            <h2>Texto reconocido</h2>

            <p>
                {{ texto }}
            </p>

        </div>

    {% endif %}

</div>

</body>

</html>
